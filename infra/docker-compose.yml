name: ai-novel

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_novel
      POSTGRES_PASSWORD: ai_novel
      POSTGRES_DB: ai_novel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_novel -d ai_novel"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ai_novel:ai_novel@db:5432/ai_novel
      # 启用向量检索（RAG）时：加 --profile qdrant 启动，并取消下面注释
      # QDRANT_URL: http://qdrant:6333
    volumes:
      - api_storage:/app/server/storage
    ports:
      # API 仅供本机调试访问；对外统一走 web 的 /api 反代
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    profiles: ["qdrant"]
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  postgres_data:
  api_storage:
  qdrant_storage:
